name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk pompon-touch.apk
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ぽんぽんタッチ Android版
          body: |
            Androidスマホにダウンロードしてインストールしてください。
            中身は公開ページを開くので、ゲームの更新はアプリを入れ直さなくても自動で反映されます。
          files: pompon-touch.apk
          make_latest: true
