plugins { id 'com.android.application' }

def vc = (System.getenv('VERSION_CODE') ?: '1') as int

android {
    namespace 'io.github.sohfuji04.pompontouch'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.sohfuji04.pompontouch'
        minSdk 24
        targetSdk 34
        versionCode vc
        versionName "1.0.${vc}"
    }
    signingConfigs {
        release {
            storeFile file('../pompon.keystore')
            storePassword 'pompon-touch'
            keyAlias 'pompon'
            keyPassword 'pompon-touch'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
