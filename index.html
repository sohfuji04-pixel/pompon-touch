<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ぽんぽんタッチ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--cream:#fff8ef;--ink:#4b3a55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:block}
#home{overflow-y:auto;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 28px);
  background:radial-gradient(circle at 15% 0%,#ffe1ec 0,transparent 45%),radial-gradient(circle at 100% 30%,#dff3ff 0,transparent 45%),var(--cream)}
.logo{display:flex;align-items:center;gap:12px;margin:4px 4px 6px}
.logo h1{font-size:30px;margin:0;font-weight:800;letter-spacing:.02em;color:#ff7aa2;text-shadow:0 3px 0 #ffd6e3}
.sub{margin:0 6px 18px;font-size:14px;opacity:.75}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:none;border-radius:28px;padding:16px 12px 14px;text-align:center;font:inherit;color:inherit;cursor:pointer;
  box-shadow:0 6px 0 rgba(0,0,0,.08),0 12px 24px rgba(120,80,100,.12);transition:transform .12s}
.card:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.card svg{width:84px;height:84px;display:block;margin:0 auto 6px}
.card b{display:block;font-size:17px;font-weight:800}
.card small{display:block;font-size:11.5px;opacity:.75;margin-top:3px;line-height:1.35}
.c1{background:linear-gradient(160deg,#ffe3ee,#ffc9dc)}
.c2{background:linear-gradient(160deg,#ffffff,#e9e9e9);}
.c3{background:linear-gradient(160deg,#3a3570,#221e47);color:#f3eefe}
.c4{background:linear-gradient(160deg,#d6f0ff,#a9dcff)}
.c5{background:linear-gradient(160deg,#fff3c4,#ffe08a)}
.c6{background:linear-gradient(160deg,#fff0dc,#ffd9b0)}
.c7{background:linear-gradient(160deg,#e4f8d8,#bfe9a8)}
.c8{background:linear-gradient(160deg,#f1e8ff,#d9c8ff)}
.c9{background:linear-gradient(160deg,#ffe8f2,#ffc2da)}
.c10{background:linear-gradient(160deg,#fffaf0,#ffe9c9)}

.note{margin:22px 4px 0;background:#fff;border-radius:20px;padding:14px 16px;font-size:12.5px;line-height:1.7;box-shadow:0 4px 14px rgba(120,80,100,.08)}
.note b{color:#ff7aa2}
#cv{position:fixed;inset:0;touch-action:none}
#exit{position:fixed;left:calc(env(safe-area-inset-left) + 12px);top:calc(env(safe-area-inset-top) + 12px);width:54px;height:54px;border-radius:50%;
  background:conic-gradient(#ff7aa2 calc(var(--p,0)*1turn),rgba(255,255,255,.35) 0);display:none;place-items:center;z-index:10;touch-action:none}
#confirm{position:fixed;left:calc(env(safe-area-inset-left) + 76px);top:calc(env(safe-area-inset-top) + 14px);z-index:11;display:none;border:none;
  background:#ff7aa2;color:#fff;font:inherit;font-weight:800;font-size:16px;padding:12px 20px;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.2);touch-action:manipulation}
#confirm.on{display:block}
#exit{width:64px;height:64px}
#exit::before{content:"";position:absolute;inset:9px;border-radius:50%;background:rgba(255,255,255,.75)}
#exit svg{position:relative;width:26px;height:26px}
#hint{position:fixed;left:calc(env(safe-area-inset-left) + 74px);top:calc(env(safe-area-inset-top) + 26px);font-size:13px;background:rgba(255,255,255,.85);
  padding:5px 12px;border-radius:14px;z-index:10;display:none;transition:opacity .6s}
/* sleep */
#sleep{background:linear-gradient(180deg,#2d2f72 0%,#4a3f8e 55%,#7b62a8 100%);color:#fff;overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 0}
#sleep::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.7;
  background-image:radial-gradient(2px 2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 78% 9%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 88% 34%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 30% 44%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 60% 26%,#ffe9a8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 8% 70%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 92% 76%,#ffe9a8 50%,transparent 51%);animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.35}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:4px;position:relative}
.back{background:rgba(255,255,255,.18);border:none;color:#fff;font:inherit;font-weight:800;border-radius:18px;padding:10px 16px;font-size:15px}
.top h2{margin:0;font-size:21px;font-weight:800}
.moonbox{text-align:center;position:relative}
.moonbox svg{width:170px;height:120px;display:block;margin:0 auto}
#sleep.playing .moon{animation:sway 4s ease-in-out infinite;transform-origin:70px 60px}
@keyframes sway{50%{transform:rotate(-6deg) translateY(3px)}}
.zz{animation:zz 3s linear infinite;opacity:0}
.zz.b{animation-delay:1s}.zz.c{animation-delay:2s}
#sleep:not(.playing) .zz{animation:none;opacity:.5}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}}
#nowp{font-size:14px;font-weight:800;margin:2px 0 6px;min-height:1.4em;color:#ffe9a8}
#sleep h3{font-size:14px;margin:16px 4px 8px;opacity:.9;position:relative}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative}
.sb{background:rgba(255,255,255,.13);border:2px solid transparent;color:#fff;font:inherit;font-weight:800;border-radius:24px;padding:12px 2px 10px;font-size:12.5px;transition:all .2s}
.sb i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 6px;border-radius:50%;background:var(--c);font-style:normal;font-size:27px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.sb.on{background:rgba(255,255,255,.3);border-color:#ffe9a8;box-shadow:0 0 22px rgba(255,233,168,.5)}
.sb.on i{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) scale(1.06)}}
.row{margin-top:18px;background:rgba(255,255,255,.12);border-radius:22px;padding:14px;position:relative}
.row label{font-size:13px;font-weight:800}
.tm{display:flex;gap:8px;margin-top:8px}
.tm button{flex:1;background:rgba(255,255,255,.15);border:none;color:#fff;font:inherit;font-weight:800;border-radius:14px;padding:9px 0;font-size:13px}
.tm button.on{background:#ffb3cf;color:#5a3a6a}
input[type=range]{width:100%;margin-top:10px;accent-color:#ffb3cf}
#remain{font-size:12.5px;opacity:.85;margin-top:8px;min-height:1em}
.stopbar{position:sticky;bottom:0;padding:14px 0 calc(env(safe-area-inset-bottom) + 14px);margin-top:10px;background:linear-gradient(transparent,#7b62a8 40%)}
.stopall{width:100%;background:#ff8fb3;border:none;color:#fff;font:inherit;font-weight:800;border-radius:22px;padding:15px;font-size:17px;box-shadow:0 5px 0 #d9658c;opacity:.45;transition:opacity .2s}
.stopall.live{opacity:1}
.stopall:active{transform:translateY(3px);box-shadow:0 2px 0 #d9658c}
</style>
</head>
<body>

      <b>うんち・おなら</b><small>ぷりっ！ぷぅ〜！<br>トイレにじゃ〜</small>
    </button>
    <button class="card c7" data-mode="peek">
      <svg viewBox="0 0 100 100"><ellipse cx="40" cy="24" rx="7" ry="17" fill="#fff" stroke="#e7d9e0" stroke-width="2"/><ellipse cx="58" cy="24" rx="7" ry="17" fill="#fff" stroke="#e7d9e0" stroke-width="2"/><circle cx="49" cy="48" r="20" fill="#fff" stroke="#e7d9e0" stroke-width="2"/><ellipse cx="42" cy="46" rx="3" ry="4" fill="#3a2a35"/><ellipse cx="56" cy="46" rx="3" ry="4" fill="#3a2a35"/><circle cx="28" cy="70" r="20" fill="#7fd27a"/><circle cx="50" cy="63" r="22" fill="#8ad884"/><circle cx="72" cy="70" r="20" fill="#7fd27a"/><rect x="10" y="70" width="80" height="22" rx="11" fill="#6cc46a"/><circle cx="36" cy="66" r="3.5" fill="#ff9ec0"/><circle cx="64" cy="61" r="3.5" fill="#ffe066"/></svg>
      <b>いないいないばあ</b><small>くさむらから<br>どうぶつが ばあ！</small>
    </button>
    <button class="card c8" data-mode="piano">
      <svg viewBox="0 0 100 100"><rect x="10" y="38" width="9" height="52" rx="4.5" fill="#ff9aa8"/><rect x="20.5" y="38" width="9" height="52" rx="4.5" fill="#ffb877"/><rect x="31" y="38" width="9" height="52" rx="4.5" fill="#ffe066"/><rect x="41.5" y="38" width="9" height="52" rx="4.5" fill="#a8e37c"/><rect x="52" y="38" width="9" height="52" rx="4.5" fill="#7fd8c8"/><rect x="62.5" y="38" width="9" height="52" rx="4.5" fill="#86c5ff"/><rect x="73" y="38" width="9" height="52" rx="4.5" fill="#b59bff"/><circle cx="30" cy="24" r="10" fill="#ffc08a"/><circle cx="56" cy="22" r="10" fill="#ffe169"/><text x="74" y="30" font-size="22" fill="#8a6cf0">♪</text></svg>
      <b>どうぶつピアノ</b><small>おすと どうぶつが<br>うたうよ</small>
    </button>
    <button class="card c9" data-mode="phone">
      <svg viewBox="0 0 100 100"><rect x="27" y="8" width="46" height="84" rx="12" fill="#ff9ec0"/><rect x="32" y="18" width="36" height="58" rx="6" fill="#e8f6ff"/><path d="M38 32 L40 22 L47 28Z M62 32 L60 22 L53 28Z" fill="#ffc08a"/><circle cx="50" cy="40" r="13" fill="#ffc08a"/><ellipse cx="45" cy="39" rx="2" ry="2.6" fill="#3a2a35"/><ellipse cx="55" cy="39" rx="2" ry="2.6" fill="#3a2a35"/><circle cx="50" cy="66" r="6" fill="#4fcf86"/><path d="M80 34 q6 8 0 16 M86 28 q10 14 0 28" stroke="#ff6f9c" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <b>もしもし</b><small>どうぶつから<br>でんわが くるよ</small>

    <button class="card c10" data-mode="draw">
      <svg viewBox="0 0 100 100"><path d="M14 74 A36 36 0 0 1 86 74" stroke="#ff9aa8" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M23 74 A27 27 0 0 1 77 74" stroke="#ffe066" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M32 74 A18 18 0 0 1 68 74" stroke="#86c5ff" stroke-width="7" fill="none" stroke-linecap="round"/><g transform="translate(76 28)"><circle cx="0" cy="-8" r="6" fill="#ffb3d1"/><circle cx="7.6" cy="-2.5" r="6" fill="#ffb3d1"/><circle cx="4.7" cy="6.5" r="6" fill="#ffb3d1"/><circle cx="-4.7" cy="6.5" r="6" fill="#ffb3d1"/><circle cx="-7.6" cy="-2.5" r="6" fill="#ffb3d1"/><circle r="5.5" fill="#ffe066"/></g></svg>
      <b>おえかき</b><small>なぞると にじいろ<br>タップで おはな</small>
    </button>
    <button class="card c2" data-mode="contrast">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#111"/><circle cx="50" cy="50" r="32" fill="#fff"/><circle cx="50" cy="50" r="22" fill="#111"/><circle cx="50" cy="50" r="12" fill="#fff"/><circle cx="50" cy="50" r="5" fill="#e3262e"/></svg>
      <b>しろくろ</b><small>新生児むけの<br>はっきり模様</small>
    </button>
    <button class="card c3" data-mode="sleep">
      <svg viewBox="0 0 100 100"><path d="M62 18a34 34 0 1 0 22 50A28 28 0 0 1 62 18z" fill="#ffe7a3"/><circle cx="24" cy="24" r="3" fill="#fff"/><circle cx="80" cy="30" r="2" fill="#fff"/><circle cx="72" cy="12" r="1.5" fill="#fff"/><path d="M40 52 q4 4 8 0 M56 58 q4 4 8 0" stroke="#5a4a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
      <b>ねんねの音</b><small>ホワイトノイズ・心音<br>オルゴール・タイマー</small>

      <svg viewBox="0 0 100 100"><ellipse cx="44" cy="58" rx="26" ry="16" fill="#ffd84a"/><ellipse cx="70" cy="52" rx="15" ry="13" fill="#ffd84a"/><circle cx="66" cy="40" r="7" fill="#ffc0a8"/><circle cx="76" cy="41" r="6" fill="#ffc0a8"/><circle cx="75" cy="50" r="2.6" fill="#222"/><circle cx="85" cy="54" r="2.4" fill="#ff8fa0"/><path d="M18 60 q-10 6 -6 16" stroke="#e8bf2e" stroke-width="4" fill="none" stroke-linecap="round"/></svg>

  <div class="note">

    ・iPhoneは「アクセスガイド」、Androidは「アプリ固定」で画面を固定できます<br>
    ・広告はありません。音量は控えめにして、短い時間を大人と一緒に楽しんでください<br>
    ・ペットに使うときは、爪で画面が傷つかないよう保護フィルムがおすすめです

</div>

<div id="sleep" class="screen">
  <div class="top"><button class="back" id="sleepBack">‹ もどる</button><h2>ねんねの音</h2></div>
  <div class="moonbox">
    <svg viewBox="0 0 170 120"><g class="moon"><path d="M78 14a44 44 0 1 0 40 62A36 36 0 0 1 78 14z" fill="#ffe9a8"/><path d="M58 62 q5 5 10 0 M80 68 q5 5 10 0" stroke="#8a6a3a" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="56" cy="74" rx="6" ry="3.5" fill="#ffb3a8" opacity=".7"/><ellipse cx="94" cy="80" rx="6" ry="3.5" fill="#ffb3a8" opacity=".7"/><path d="M68 84 q6 4 12 0" stroke="#8a6a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M60 8 q-10 10 4 14" stroke="#ffb3cf" stroke-width="0" fill="none"/><path d="M70 12 L60 4 L74 6Z" fill="#ff9ec0"/><circle cx="60" cy="4" r="4" fill="#fff"/></g>
    <text class="zz" x="126" y="40" font-size="16" fill="#fff" font-weight="800">z</text><text class="zz b" x="136" y="30" font-size="13" fill="#fff" font-weight="800">z</text><text class="zz c" x="144" y="22" font-size="10" fill="#fff" font-weight="800">z</text></svg>
    <div id="nowp">ききたい おとを タップしてね</div>
  </div>
  <h3>🎵 こもりうた</h3><div class="sg" id="sg1"></div>
  <h3>💗 おなかの中みたいな音</h3><div class="sg" id="sg2"></div>
  <h3>🌙 なきやみの音</h3><div class="sg" id="sg3"></div>
  <div class="row">
    <label>おやすみタイマー</label>
    <div class="tm" id="tm"><button data-m="15">15分</button><button data-m="30" class="on">30分</button><button data-m="60">60分</button><button data-m="0">ずっと</button></div>

<canvas id="cv" class="screen"></canvas>
<div id="exit"><svg viewBox="0 0 24 24"><path d="M3 11 L12 3 L21 11 V21 H14 V15 H10 V21 H3Z" fill="#ff7aa2"/></svg></div>
<div id="hint">長押し or タップ→「もどる」</div>
<button id="confirm">‹ もどる</button>

<script>
"use strict";
const $=s=>document.querySelector(s);
const R=Math.random, TAU=Math.PI*2;

/* ================= AUDIO ================= */
let AC,master,noiseBuf,brownBuf;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.8;
  const comp=AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
  const len=AC.sampleRate*2;
  noiseBuf=AC.createBuffer(1,len,AC.sampleRate); const d=noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=R()*2-1;
  brownBuf=AC.createBuffer(1,len,AC.sampleRate); const b=brownBuf.getChannelData(0); let l=0;
  for(let i=0;i<len;i++){ l=(l+.02*(R()*2-1))/1.02; b[i]=l*3.5; }
  // smooth the loop seam
  for(let i=0;i<2000;i++){ const k=i/2000; b[i]*=k; b[len-1-i]*=k; }
}
function tone(o){
  const t=AC.currentTime+(o.at||0), dur=o.dur||.3, f=o.f;
  const os=AC.createOscillator(); os.type=o.type||'sine';
  os.frequency.setValueAtTime(f[0],t);
  if(f.length===2) os.frequency.exponentialRampToValueAtTime(f[1],t+dur*.8);
  if(f.length===3){ os.frequency.exponentialRampToValueAtTime(f[1],t+dur*.35); os.frequency.exponentialRampToValueAtTime(f[2],t+dur*.9); }
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(o.vol||.2,t+(o.atk||.012));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let node=os;

const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1567.98];
function sparkle(at=0){ let i=R()*3|0; for(let k=0;k<3;k++){ i+=1+(R()*2|0); tone({type:'triangle',f:[PENTA[Math.min(i,8)]*2,PENTA[Math.min(i,8)]*2],dur:.45,vol:.05,at:at+k*.07}); } }
const SFX={
  neko(){ tone({type:'triangle',f:[650,980,560],dur:.42,vol:.22,vib:[7,25],lp:2600}); sparkle(.3); },
  inu(){ [0,.2].forEach(a=>tone({type:'square',f:[430,260],dur:.15,vol:.1,lp:1300,at:a})); sparkle(.42); },
  kuma(){ tone({f:[180,430],dur:.35,vol:.35}); tone({f:[260,540],dur:.3,vol:.14,at:.12}); sparkle(.3); },
  usagi(){ tone({f:[500,1600],dur:.22,vol:.25}); tone({f:[700,1900],dur:.2,vol:.18,at:.18}); },

const cv=$('#cv'), c=cv.getContext('2d'); let W=0,H=0,M=0;
function resize(){ const d=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; M=Math.min(W,H);
  cv.width=W*d; cv.height=H*d; cv.style.width=W+'px'; cv.style.height=H+'px'; c.setTransform(d,0,0,d,0,0); }
addEventListener('resize',resize); resize();

const PCOL=['#ff8fb0','#ffd84a','#7cc8ff','#9be38a','#c6a2ff','#ffb35c'];
let parts=[];
function burst(x,y,n,cols=PCOL,sp=1){ for(let i=0;i<n;i++){ const a=R()*TAU, v=(120+R()*260)*sp*(M/420);
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:1,max:.7+R()*.6,s:(6+R()*9)*(M/420),col:cols[R()*cols.length|0],sh:R()<.5?'star':(R()<.5?'heart':'dot'),rot:R()*TAU}); } }
function updParts(dt,g=420){ for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=g*dt; p.vx*=.98; p.life-=dt/p.max; p.rot+=dt*3; } parts=parts.filter(p=>p.life>0); }
function drawParts(){ for(const p of parts){ c.save(); c.globalAlpha=Math.max(0,p.life); c.translate(p.x,p.y); c.rotate(p.rot); c.fillStyle=p.col;
  if(p.sh==='star') star(0,0,p.s,p.s*.45); else if(p.sh==='heart') heart(p.s); else { c.beginPath(); c.arc(0,0,p.s*.5,0,TAU); c.fill(); }
  c.restore(); } c.globalAlpha=1; }
function star(x,y,r1,r2){ c.beginPath(); for(let i=0;i<10;i++){ const r=i%2?r2:r1, a=-Math.PI/2+i*Math.PI/5; c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r); } c.closePath(); c.fill(); }
function heart(s){ c.beginPath(); c.moveTo(0,s*.35); c.bezierCurveTo(-s*1.1,-s*.35,-s*.45,-s*1.05,0,-s*.4); c.bezierCurveTo(s*.45,-s*1.05,s*1.1,-s*.35,0,s*.35); c.fill(); }
const ell=(x,y,rx,ry,col,rot=0)=>{ c.fillStyle=col; c.beginPath(); c.ellipse(x,y,rx,ry,rot,0,TAU); c.fill(); };
const INK='#3a2a35';
function eyes(r,y=-.05,gap=.36,blink=1){ for(const s of[-1,1]){ ell(s*gap*r,y*r,r*.1,r*.13*blink,INK); if(blink>.5) ell(s*gap*r-r*.03,y*r-r*.05,r*.04,r*.04,'#fff'); } }
function cheeks(r){ for(const s of[-1,1]) ell(s*.62*r,.22*r,r*.15,r*.09,'rgba(255,130,165,.45)'); }
function omega(r,y){ c.strokeStyle=INK; c.lineWidth=r*.055; c.lineCap='round'; c.beginPath(); c.arc(-r*.08,y*r,r*.08,.15,Math.PI-.15); c.moveTo(r*.16-r*.0,y*r); c.arc(r*.08,y*r,r*.08,.15,Math.PI-.15); c.stroke(); }

/* --- cute animals (flat, rounded, pastel) --- */
const KINDS=['neko','inu','kuma','usagi','hiyoko','sakana','panda'];
const COL={neko:'#ffc08a',inu:'#f6dcb6',kuma:'#c9a07a',usagi:'#ffffff',hiyoko:'#ffe169',sakana:'#7cc8ff',panda:'#ffffff'};
function drawAnimal(k,r,blink){
  c.lineWidth=r*.05; c.strokeStyle='rgba(110,70,90,.16)';
  const col=COL[k];
  if(k==='sakana'){
    c.fillStyle='#57b0ef'; c.beginPath(); c.moveTo(r*.7,0); c.lineTo(r*1.3,-r*.55); c.quadraticCurveTo(r*1.1,0,r*1.3,r*.55); c.closePath(); c.fill();
    c.fillStyle=col; c.beginPath(); c.ellipse(0,0,r,r*.78,0,0,TAU); c.fill(); c.stroke();
    ell(r*.05,r*.3,r*.55,r*.2,'rgba(255,255,255,.35)');
    ell(-r*.15,-r*.62,r*.3,r*.14,'#57b0ef',-.2);
    ell(-r*.42,-r*.1,r*.11,r*.14*blink,INK); if(blink>.5) ell(-r*.46,-r*.16,r*.045,r*.045,'#fff');
    ell(-r*.55,r*.22,r*.13,r*.08,'rgba(255,130,165,.45)');
    c.strokeStyle=INK; c.lineWidth=r*.05; c.beginPath(); c.arc(-r*.8,r*.12,r*.07,0,TAU); c.stroke();

  }

  if(k==='neko'){ for(const s of[-1,1]){ c.fillStyle=col; c.beginPath(); c.moveTo(s*.82*r,-.3*r); c.quadraticCurveTo(s*.72*r,-1.1*r,s*.62*r,-1.05*r); c.quadraticCurveTo(s*.4*r,-1.0*r,s*.12*r,-.78*r); c.closePath(); c.fill(); c.stroke();
    c.fillStyle='#ffa3bd'; c.beginPath(); c.moveTo(s*.7*r,-.45*r); c.lineTo(s*.62*r,-.88*r); c.lineTo(s*.3*r,-.75*r); c.closePath(); c.fill(); } }
  if(k==='kuma'||k==='panda'){ const ec=k==='panda'?'#3d3540':col; for(const s of[-1,1]){ ell(s*.68*r,-.68*r,r*.33,r*.33,ec); if(k==='kuma') ell(s*.68*r,-.68*r,r*.17,r*.17,'#efb9a2'); } }
  if(k==='usagi'){ for(const s of[-1,1]){ ell(s*.32*r,-1.0*r,r*.21,r*.58,col,s*.12); c.stroke(); ell(s*.32*r,-.98*r,r*.1,r*.4,'#ffbfd0',s*.12); } }
  if(k==='hiyoko'){ ell(-r*.12,-r*1.0,r*.1,r*.2,col,-.4); ell(r*.06,-r*1.03,r*.09,r*.19,col,.3); }
  // head
  c.fillStyle=col; c.beginPath(); c.arc(0,0,r,0,TAU); c.fill(); c.stroke();
  ell(-r*.35,-r*.5,r*.32,r*.18,'rgba(255,255,255,.35)',-.5);
  if(k==='inu'){ for(const s of[-1,1]) ell(s*.86*r,-.12*r,r*.3,r*.56,'#c98d5f',-s*.35); ell(0,.32*r,r*.44,r*.3,'#fff6ea'); }
  if(k==='kuma') ell(0,.32*r,r*.36,r*.27,'#ecd4b6');
  if(k==='panda'){ for(const s of[-1,1]) ell(s*.36*r,-.03*r,r*.2,r*.26,'#3d3540',s*.5); }
  // face
  if(k==='panda'){ for(const s of[-1,1]){ ell(s*.36*r,-.05*r,r*.08,r*.1*blink,'#fff'); ell(s*.38*r,-.03*r,r*.045,r*.06*blink,INK); } } else eyes(r,-.05,.36,blink);
  cheeks(r);
  if(k==='hiyoko'){ c.fillStyle='#ff9a3c'; c.beginPath(); c.moveTo(-r*.13,r*.16); c.lineTo(0,r*.07); c.lineTo(r*.13,r*.16); c.lineTo(0,r*.3); c.closePath(); c.fill(); }
  else {
    if(k==='neko'||k==='usagi') { c.fillStyle='#ff8fa8'; c.beginPath(); c.moveTo(-r*.07,r*.12); c.lineTo(r*.07,r*.12); c.lineTo(0,r*.2); c.closePath(); c.fill(); }
    else ell(0,r*.17,r*.11,r*.08,INK);
    omega(r,.24);
  }
  if(k==='neko'){ c.strokeStyle='rgba(58,42,53,.5)'; c.lineWidth=r*.03; for(const s of[-1,1]) for(const dy of[-.04,.08]){ c.beginPath(); c.moveTo(s*.55*r,(.12+dy)*r); c.lineTo(s*.95*r,(.08+dy*1.6)*r); c.stroke(); } }
}

/* ================= MODE: TOUCH ================= */
const TOUCH={
  init(){ this.items=[]; this.bub=[]; this.t=0; this.lt=0; this.ls=0; this.lastK='';
    this.clouds=[0,1,2,3].map(i=>({x:R()*W,y:H*(.08+.22*i),s:.6+R()*.6,v:6+R()*10})); },
  update(dt){ const t=this.t+=dt;
    while(this.bub.length<5) this.bub.push({x:R()*W,y:H+60+R()*H*.6,r:(22+R()*26)*(M/420),v:(28+R()*30),ph:R()*6});
    for(const b of this.bub){ b.y-=b.v*dt; b.x+=Math.sin(t*1.3+b.ph)*.4; }
    this.bub=this.bub.filter(b=>b.y>-b.r*2);

    updParts(dt);
  },
  draw(){ const t=this.t;

    // hills
    c.fillStyle='#c9efc0'; c.beginPath(); c.moveTo(0,H); c.lineTo(0,H*.86); c.quadraticCurveTo(W*.3,H*.78,W*.6,H*.87); c.quadraticCurveTo(W*.85,H*.93,W,H*.84); c.lineTo(W,H); c.fill();
    c.fillStyle='#b2e6a8'; c.beginPath(); c.moveTo(0,H); c.lineTo(0,H*.93); c.quadraticCurveTo(W*.5,H*.85,W,H*.94); c.lineTo(W,H); c.fill();
    for(const cl of this.clouds){ const s=cl.s*(M/420); c.fillStyle='rgba(255,255,255,.9)'; c.beginPath();
      c.arc(cl.x,cl.y,26*s,0,TAU); c.arc(cl.x+28*s,cl.y-10*s,32*s,0,TAU); c.arc(cl.x+60*s,cl.y,24*s,0,TAU); c.fill(); c.fillRect(cl.x,cl.y,60*s,24*s*0+1); }

      gr.addColorStop(0,'rgba(255,255,255,.9)'); gr.addColorStop(.6,'rgba(200,230,255,.25)'); gr.addColorStop(.9,`hsla(${(t*40+b.ph*60)%360},90%,75%,.5)`); gr.addColorStop(1,'rgba(255,255,255,.7)');

/* ================= MODE: CONTRAST ================= */
const CONTRAST={
  init(){ this.t=0; this.rings=[]; this.dots=[...Array(10)].map(()=>({x:R()*W,y:R()*H,r:2+R()*4,v:5+R()*10,ph:R()*6})); },

    if(idx===2){ const bl=(t%4)<.15?.1:1; ell(0,0,S,S,'#fff'); for(const s of[-1,1]){ ell(s*.36*S,-.15*S,.13*S,.13*S*bl,'#000'); ell(s*.56*S,.22*S,.11*S,.08*S,'#e3262e'); }

    for(const r of this.rings){ c.globalAlpha=Math.max(0,r.life); c.strokeStyle=r.col; c.lineWidth=M*.03; c.beginPath(); c.arc(r.x,r.y,r.r,0,TAU); c.stroke(); } c.globalAlpha=1;
  },
  tap(x,y){ this.rings.push({x,y,r:10,life:1,col:R()<.65?'#fff':'#e3262e'}); SFX.chime(); },
  move(){}
};

/* ================= MODE: CAT ================= */
const CAT={
  types:['mouse','fish','bug','dot'],
  init(){ this.t=0; this.count=0; this.ti=0; this.p=null; this.resp=.3; this.nc=3; },
  spawn(){ const type=this.types[this.ti%4], s=M*(type==='dot'?.03:.075), side=R()*4|0;
    const x=side===0?-s*3:side===1?W+s*3:R()*W, y=side===2?-s*3:side===3?H+s*3:R()*H;
    this.p={type,x,y,vx:0,vy:0,s,ang:0,pause:0,leg:0}; this.tgt(); },
  tgt(){ const p=this.p; p.tx=W*(.08+.84*R()); p.ty=H*(.12+.78*R()); const k=M/420;
    p.spd=(p.type==='dot'?110+R()*200:p.type==='fish'?45+R()*80:55+R()*140)*k; },

    else { const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy);
      if(d<12){ this.tgt(); p.pause=p.type==='dot'?.3+R()*.9:(R()<.7?.8+R()*2.2:.2); }
      else { const k=Math.min(1,dt*(p.type==='fish'?1.1:2.2)); p.vx+=(dx/d*p.spd-p.vx)*k; p.vy+=(dy/d*p.spd-p.vy)*k; } }
    p.x+=p.vx*dt; p.y+=p.vy*dt; const v=Math.hypot(p.vx,p.vy); if(v>8) p.ang=Math.atan2(p.vy,p.vx); p.leg+=v*dt*.08;
    this.nc-=dt; if(this.nc<0){ this.nc=4+R()*4; if(p.type==='mouse') SFX.squeak(.06); else if(p.type==='fish') SFX.sakana(); else if(p.type==='bug') SFX.chirp(); }
  },
  draw(){ const t=this.t;
    const g=c.createRadialGradient(W/2,H*.4,0,W/2,H/2,Math.max(W,H)*.8); g.addColorStop(0,'#2f63d6'); g.addColorStop(1,'#13307a'); c.fillStyle=g; c.fillRect(0,0,W,H);
    c.fillStyle='rgba(255,255,255,.05)'; for(let y=20;y<H;y+=46) for(let x=(y/46%2)*23+10;x<W;x+=46){ c.beginPath(); c.arc(x,y,3,0,TAU); c.fill(); }
    const p=this.p;
    if(p){ const s=p.s; c.save(); c.translate(p.x,p.y);

      else { c.rotate(p.ang); c.fillStyle='rgba(0,0,20,.25)'; c.beginPath(); c.ellipse(0,s*.5,s*1.2,s*.35,0,0,TAU); c.fill();

const DOG={
  init(){ this.t=0; this.nx=2; this.balls=[0,1].map(()=>({x:W*(.25+R()*.5),y:H*(.3+R()*.4),vx:(R()-.5)*300,vy:(R()-.5)*300,r:M*.085,rot:0,sq:0})); },
  update(dt){ this.t+=dt; updParts(dt,350);
    for(const b of this.balls){ b.x+=b.vx*dt; b.y+=b.vy*dt; const f=Math.pow(.55,dt); b.vx*=f; b.vy*=f; b.rot+=b.vx*dt/b.r; b.sq*=Math.pow(.01,dt);
      const sp=Math.hypot(b.vx,b.vy); if(sp<30&&R()<dt*.5){ const a=R()*TAU, v=(250+R()*350)*(M/420); b.vx=Math.cos(a)*v; b.vy=Math.sin(a)*v; }

      if(b.y<b.r){ b.y=b.r; b.vy=Math.abs(b.vy)*.8; hit=true; } if(b.y>H-b.r){ b.y=H-b.r; b.vy=-Math.abs(b.vy)*.8; hit=true; }

  },
  draw(){ const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#3b74e6'); g.addColorStop(1,'#1c3f9e'); c.fillStyle=g; c.fillRect(0,0,W,H);
    c.fillStyle='rgba(255,255,255,.06)'; for(let i=0;i<8;i++){ c.save(); c.translate((i*173)%W,(i*311)%H); c.rotate(i); c.beginPath(); c.ellipse(0,0,30,12,0,0,TAU); c.arc(-30,-8,10,0,TAU); c.arc(-30,8,10,0,TAU); c.arc(30,-8,10,0,TAU); c.arc(30,8,10,0,TAU); c.fill(); c.restore(); }
    for(const b of this.balls){ c.fillStyle='rgba(0,0,30,.25)'; c.beginPath(); c.ellipse(b.x,b.y+b.r*.95,b.r*.8,b.r*.18,0,0,TAU); c.fill();
      c.save(); c.translate(b.x,b.y); c.scale(1+b.sq,1-b.sq); c.rotate(b.rot);
      ell(0,0,b.r,b.r,'#dcef3c'); c.strokeStyle='#fff'; c.lineWidth=b.r*.13; c.beginPath(); c.arc(-b.r*1.25,0,b.r*.95,-.9,.9); c.stroke(); c.beginPath(); c.arc(b.r*1.25,0,b.r*.95,Math.PI-.9,Math.PI+.9); c.stroke();
      ell(-b.r*.35,-b.r*.4,b.r*.25,b.r*.15,'rgba(255,255,255,.35)',-.6); c.restore(); }
    drawParts(); },
  tap(x,y){ for(const b of this.balls){ const d=Math.hypot(x-b.x,y-b.y); if(d<b.r*1.5){ const a=d>1?Math.atan2(b.y-y,b.x-x):R()*TAU, v=(500+R()*400)*(M/420);
      b.vx=Math.cos(a)*v; b.vy=Math.sin(a)*v; b.sq=.35; SFX.squeak(.35); burst(b.x,b.y,10,['#dcef3c','#fff','#ffd84a']); return; } } },
  move(x,y){}
};

/* ================= SHARED: text popups / helpers ================= */
let texts=[];
function popText(x,y,s,col,size){ texts.push({x,y,s,col,size,age:0}); }
function updTexts(dt){ for(const t of texts){ t.age+=dt; t.y-=22*dt; } texts=texts.filter(t=>t.age<1.5); }
function drawTexts(){ for(const t of texts){ const k=t.age<.18?(t.age/.18)*1.15:(t.age<.3?1.15-(t.age-.18)/.12*.15:1);
  c.save(); c.globalAlpha=Math.max(0,Math.min(1,(1.5-t.age)/.4)); c.translate(t.x,t.y); c.scale(k,k);
  c.font=`800 ${Math.round(t.size)}px "M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif`; c.textAlign='center'; c.textBaseline='middle';
  c.lineJoin='round'; c.strokeStyle='#fff'; c.lineWidth=t.size*.22; c.strokeText(t.s,0,0); c.fillStyle=t.col; c.fillText(t.s,0,0); c.restore(); } c.globalAlpha=1; }
function rr(x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function meadow(t){ const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#bfe8ff'); g.addColorStop(.7,'#eaf6ff'); g.addColorStop(1,'#d9f3cf'); c.fillStyle=g; c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,.9)'; for(let i=0;i<3;i++){ const x=((t*(8+i*4)+i*W*.4)%(W+200))-100, y=H*(.08+i*.07), s=M/420*(.7+i*.2); c.beginPath(); c.arc(x,y,24*s,0,TAU); c.arc(x+26*s,y-9*s,30*s,0,TAU); c.arc(x+55*s,y,22*s,0,TAU); c.fill(); }
  c.fillStyle='#c9efc0'; c.beginPath(); c.moveTo(0,H); c.lineTo(0,H*.55); c.quadraticCurveTo(W*.5,H*.48,W,H*.56); c.lineTo(W,H); c.fill(); }

/* extra sounds (all cartoon / toy-like, nothing realistic) */
Object.assign(SFX,{
  puri(){ tone({f:[320,760],dur:.12,vol:.25}); tone({f:[760,520],dur:.1,vol:.14,at:.1}); },

  answer(){ tone({f:[523,523],dur:.3,vol:.12}); tone({f:[784,784],dur:.5,vol:.12,at:.12}); },

});

/* ================= MODE: POOP / FART ================= */
function drawBack(k,s){
  const col=k==='usagi'?'#fdf7f2':COL[k];
  c.lineWidth=s*.05; c.strokeStyle='rgba(110,70,90,.18)';
  const hy=-1.05*s, hr=.72*s;
  if(k==='kuma') for(const d of[-1,1]){ ell(d*.5*s,hy-.62*s,.26*s,.26*s,col); c.stroke(); }
  if(k==='neko') for(const d of[-1,1]){ c.fillStyle=col; c.beginPath(); c.moveTo(d*.66*s,hy-.25*s); c.lineTo(d*.56*s,hy-.95*s); c.lineTo(d*.14*s,hy-.62*s); c.closePath(); c.fill(); c.stroke(); }
  if(k==='usagi') for(const d of[-1,1]){ ell(d*.28*s,hy-.95*s,.17*s,.5*s,col,d*.1); c.stroke(); }
  for(const d of[-1,1]){ ell(d*.82*s,-.15*s,.18*s,.28*s,col,d*.3); c.stroke(); }
  ell(0,0,.85*s,.95*s,col); c.stroke();
  ell(0,hy,hr,hr,col); c.stroke();
  ell(-.25*s,hy-.35*s,.25*s,.13*s,'rgba(255,255,255,.35)',-.4);
  ell(.6*s,hy-.03*s,.06*s,.09*s,INK); ell(.6*s,hy+.17*s,.1*s,.06*s,'rgba(255,130,165,.5)');
  for(const d of[-1,1]){ ell(d*.3*s,.7*s,.36*s,.32*s,col); c.stroke(); ell(d*.3*s,.66*s,.36*s,.3*s,'rgba(255,255,255,.18)'); ell(d*.38*s,.78*s,.12*s,.07*s,'rgba(255,130,165,.45)'); }
  ell(0,.28*s,.17*s,.17*s,k==='usagi'?'#ffffff':'#f6e6d0'); c.stroke();
}
function drawPoo(s,gold){
  const a=gold?'#ffcf33':'#b9824f', b=gold?'#fff0a0':'#d3a06c';
  c.fillStyle=a; c.beginPath(); c.moveTo(-s*.15,-s*.9); c.quadraticCurveTo(s*.1,-s*1.3,s*.22,-s*1.12); c.quadraticCurveTo(s*.22,-s*.92,s*.12,-s*.86); c.closePath(); c.fill();
  ell(0,-s*.72,s*.48,s*.27,a); ell(0,-s*.38,s*.75,s*.33,a); ell(0,0,s,s*.42,a);
  ell(-s*.35,-s*.1,s*.28,s*.08,b); ell(-s*.25,-s*.48,s*.2,s*.06,b); ell(-s*.12,-s*.8,s*.12,s*.05,b);
  for(const d of[-1,1]){ ell(d*.26*s,-.36*s,s*.08,s*.1,INK); ell(d*.26*s-s*.025,-.4*s,s*.03,s*.03,'#fff'); ell(d*.5*s,-.2*s,s*.11,s*.06,'rgba(255,130,165,.55)'); }
  c.strokeStyle=INK; c.lineWidth=s*.06; c.lineCap='round'; c.beginPath(); c.arc(0,-.26*s,s*.13,.3,Math.PI-.3); c.stroke();
}
const POOP={
  chars:['kuma','neko','usagi'],
  init(){ this.t=0; this.ci=0; this.poops=[]; this.puffs=[]; this.flush=0; this.wait=0; this.sq=0; this.jy=0; this.jv=0; this.n=0; },
  geo(){ const s=M*.17, by=H*.8; return {s,cx:W/2,cy:Math.min(H*.33,by-M*.75)+this.jy,bx:W/2,by,wrx:M*.24,wry:M*.075}; },
  update(dt){ this.t+=dt; updParts(dt,600);
    this.jv+=(-this.jy)*70*dt; this.jv*=Math.pow(.03,dt); this.jy+=this.jv*dt; this.sq*=Math.pow(.005,dt);
    const g=this.geo();
    for(const p of this.poops){ p.age+=dt;
      if(p.st==='out'){ p.k=Math.min(1,p.age/.35); p.x=g.cx; p.y=g.cy+g.s*.95+p.s*.9*p.k; if(p.age>.5){ p.st='fall'; p.vy=80; } }
      else if(p.st==='fall'){ p.vy+=1500*(M/420)*dt; p.y+=p.vy*dt; p.rot+=dt*2.5;
        if(p.y>=g.by+p.s*.15){ p.y=g.by+p.s*.15; p.x=g.bx+(R()-.5)*g.wrx*.6; p.st='in'; p.rot=0;
          SFX.plop(); burst(p.x,g.by,10,['#9fdcff','#c8ecff','#ffffff'],.8); popText(g.bx+M*.26,g.by-M*.12,'ぽちゃん','#4aa6e8',M*.065);
          if(this.flush<=0) this.wait=.8; } }
      else if(p.st==='in'){ p.bob=(p.bob||0)+dt; }
      else if(p.st==='swirl'){ p.ang+=dt*9; p.rad*=Math.pow(.3,dt); p.sc*=Math.pow(.12,dt); p.rot+=dt*9; p.x=g.bx+Math.cos(p.ang)*p.rad; p.y=g.by+Math.sin(p.ang)*p.rad*.32+p.s*.15*p.sc; }
    }
    if(this.wait>0){ this.wait-=dt; if(this.wait<=0) this.startFlush(); }
    if(this.flush>0){ this.flush-=dt; if(this.flush<=0){ this.poops=this.poops.filter(p=>p.st!=='swirl'); if(this.poops.some(p=>p.st==='in')) this.wait=.6; } }
    for(const f of this.puffs){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vx*=Math.pow(.3,dt); f.vy*=Math.pow(.3,dt); f.r+=dt*M*.1; f.life-=dt*.6; }
    this.puffs=this.puffs.filter(f=>f.life>0);
  },
  startFlush(){ const g=this.geo(); const ins=this.poops.filter(p=>p.st==='in'); if(!ins.length||this.flush>0) return;
    for(const p of ins){ p.st='swirl'; p.ang=Math.atan2((p.y-g.by)/.32,p.x-g.bx)||R()*TAU; p.rad=Math.max(g.wrx*.35,Math.abs(p.x-g.bx)); p.sc=1; }
    this.flush=1.8; SFX.flush(); popText(g.bx,g.by-M*.5,'じゃ〜〜','#4aa6e8',M*.085); },
  tap(x,y){ const g=this.geo();
    if(Math.abs(x-g.bx)<M*.3&&y>g.by-M*.38&&this.poops.some(p=>p.st==='in')&&this.flush<=0){ this.startFlush(); return; }
    this.sq=.22; this.n++;
    if(R()<.55){ const gold=R()<.12;
      this.poops.push({st:'out',age:0,x:g.cx,y:g.cy+g.s,s:M*.085*(.85+R()*.3),rot:0,k:0,gold});
      SFX.puri(); popText(g.cx+g.s*1.25,g.cy+g.s*.7,gold?'きんのうんち！':'ぷりっ',gold?'#e0a800':'#a8703f',M*.075);
      if(gold) sparkle(.15);
    } else { const t=R()*3|0; SFX.fart(t); this.jv=-(t===1?750:520)*(M/420);
      for(let i=0;i<(t===1?9:6);i++) this.puffs.push({x:g.cx+(R()-.5)*g.s*.4,y:g.cy+g.s*1.05,vx:(R()-.5)*260,vy:60+R()*200,r:M*.035+R()*M*.03,life:1,col:['#eef7b8','#fff2a8','#dff2c2'][R()*3|0]});
      popText(g.cx-g.s*1.35,g.cy+g.s*.8,['ぷっ','ぷぅ〜','ぷぷぷっ'][t],'#8fae2a',M*.08); }
    if(this.n%6===0) this.ci=(this.ci+1)%this.chars.length;
    if(this.poops.length>10) this.poops.shift();
  },
  move(){},
  draw(){ const g=this.geo(), t=this.t;
    c.fillStyle='#e3f6f1'; c.fillRect(0,0,W,H);
    const ts=M*.16; c.strokeStyle='rgba(255,255,255,.9)'; c.lineWidth=3; c.beginPath();
    for(let x=0;x<W;x+=ts){ c.moveTo(x,0); c.lineTo(x,H*.72); } for(let y=0;y<H*.72;y+=ts){ c.moveTo(0,y); c.lineTo(W,y); } c.stroke();
    c.fillStyle='#ffe3ea'; c.fillRect(0,H*.72,W,H*.28); c.fillStyle='rgba(255,255,255,.5)'; for(let x=0;x<W;x+=40) for(let y=H*.74;y<H;y+=40) { c.beginPath(); c.arc(x+((y/40)%2)*20,y,3,0,TAU); c.fill(); }
    // toilet back
    c.lineWidth=M*.012; c.strokeStyle='#cfd6ee';
    c.fillStyle='rgba(60,80,120,.08)'; c.beginPath(); c.ellipse(g.bx,g.by+M*.35,M*.22,M*.04,0,0,TAU); c.fill();
    rr(g.bx-M*.2,g.by-M*.37,M*.4,M*.24,M*.06); c.fillStyle='#fdfdff'; c.fill(); c.stroke();
    rr(g.bx+M*.1,g.by-M*.32,M*.06,M*.025,M*.012); c.fillStyle='#d7ddf2'; c.fill();
    const bl=(t%3.5)<.12?.15:1; for(const d of[-1,1]){ ell(g.bx+d*M*.06,g.by-M*.25,M*.014,M*.02*bl,INK); ell(g.bx+d*M*.1,g.by-M*.21,M*.022,M*.013,'rgba(255,130,165,.5)'); }
    c.strokeStyle=INK; c.lineWidth=M*.008; c.beginPath(); c.arc(g.bx,g.by-M*.235,M*.025,.3,Math.PI-.3); c.stroke();
    c.lineWidth=M*.012; c.strokeStyle='#cfd6ee';
    ell(g.bx,g.by,M*.3,M*.11,'#fdfdff'); c.stroke();
    ell(g.bx,g.by,g.wrx,g.wry,'#a4dcff');
    if(this.flush>0){ c.save(); c.translate(g.bx,g.by); c.scale(1,.32); c.strokeStyle='rgba(255,255,255,.85)'; c.lineWidth=M*.012;
      for(let i=0;i<3;i++){ c.beginPath(); c.arc(0,0,g.wrx*(.3+i*.22),t*9+i*2,t*9+i*2+2.2); c.stroke(); } c.restore(); }
    else ell(g.bx-g.wrx*.3,g.by-g.wry*.3,g.wrx*.35,g.wry*.25,'rgba(255,255,255,.5)');
    // poops in water (clipped)
    c.save(); c.beginPath(); c.rect(0,0,W,g.by); c.ellipse(g.bx,g.by,g.wrx,g.wry,0,0,TAU); c.clip();
    for(const p of this.poops) if(p.st==='in'||p.st==='swirl'){ const sc=p.st==='swirl'?p.sc:1; c.save(); c.translate(p.x,p.y+(p.st==='in'?Math.sin(p.bob*3)*2:0)); c.rotate(p.rot); c.scale(sc,sc); drawPoo(p.s,p.gold); c.restore(); }
    c.restore();

    c.beginPath(); c.moveTo(g.bx-M*.3,g.by); c.bezierCurveTo(g.bx-M*.3,g.by+M*.2,g.bx-M*.18,g.by+M*.26,g.bx-M*.15,g.by+M*.35);
    c.lineTo(g.bx+M*.15,g.by+M*.35); c.bezierCurveTo(g.bx+M*.18,g.by+M*.26,g.bx+M*.3,g.by+M*.2,g.bx+M*.3,g.by);

// long-press exit (parent lock)
(()=>{ const ex=$('#exit'), cf=$('#confirm'); let t0=0, id=0, holding=false, cfT=0;
  const tick=()=>{ if(!holding) return; const p=Math.min(1,(performance.now()-t0)/900); ex.style.setProperty('--p',p); if(p>=1){ stop(); home(); } else id=requestAnimationFrame(tick); };
  const stop=()=>{ holding=false; cancelAnimationFrame(id); ex.style.setProperty('--p',0); };
  const home=()=>{ cf.classList.remove('on'); clearTimeout(cfT); goHome(); };
  const start=e=>{ e.preventDefault(); e.stopPropagation(); if(holding) return; holding=true; t0=performance.now(); tick();

  ex.addEventListener('touchstart',start,{passive:false});
  ex.addEventListener('mousedown',start);
  ['touchend','touchcancel','mouseup','mouseleave'].forEach(n=>ex.addEventListener(n,stop));
  const go=e=>{ e.preventDefault(); e.stopPropagation(); home(); };
  cf.addEventListener('touchend',go,{passive:false}); cf.addEventListener('click',go);
  cf.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
  ex.addEventListener('contextmenu',e=>e.preventDefault());
})();

}
const GEN={
  kira(){ const o=outG(1); const P=[['C5',1],['C5',1],['G5',1],['G5',1],['A5',1],['A5',1],['G5',2],['F5',1],['F5',1],['E5',1],['E5',1],['D5',1],['D5',1],['C5',2]];
    const Q=[['G5',1],['G5',1],['F5',1],['F5',1],['E5',1],['E5',1],['D5',2]];
    const stop=melody(o,[...P,...Q,...Q,...P].map(([n,d])=>[n.replace('5','4').replace('A4','A4'),d]),.72); return mk([],o,stop); },
  brahms(){ const o=outG(1); const M=[['E4',.5],['E4',.5],['G4',2],['E4',.5],['E4',.5],['G4',2],['E4',.5],['G4',.5],['C5',1],['B4',1],['A4',1],['A4',1],['G4',1.5],['D4',.5],['E4',.5],['F4',1],['D4',1],['D4',.5],['E4',.5],['F4',2],['D4',.5],['F4',.5],['B4',.5],['A4',.5],['G4',1],['B4',1],['C5',3]];
    return mk([],o,melody(o,M,.62)); },
  yume(){ const o=outG(1); const CH=[[261.63,329.63,392,523.25],[220,261.63,329.63,440],[174.61,220,261.63,349.23],[196,246.94,293.66,392]], PAT=[0,1,2,3,2,1];
    let i=0; const note=()=>{ const ch=CH[Math.floor(i/6)%4]; mbox(ch[PAT[i%6]]*2,o,0,.18); if(i%6===0) tone({f:[ch[0],ch[0]],dur:2.4,vol:.05,atk:.01,dest:o}); i++; };
    note(); const iv=setInterval(note,520); return mk([],o,()=>clearInterval(iv)); },
  womb(){ const o=outG(1), s=loopSrc(brownBuf), g=gn(.5); chain(s,filt('lowpass',320),g,o); const l=lfo(g.gain,.5,.35);
    const beat=()=>{ tone({f:[62,42],dur:.22,vol:.35,dest:o,lp:160}); tone({f:[55,40],dur:.2,vol:.22,dest:o,lp:150,at:.28}); };
    beat(); const iv=setInterval(beat,850); return mk([s,l],o,()=>clearInterval(iv)); },
  heart(){ const o=outG(1); const beat=()=>{ tone({f:[80,46],dur:.2,vol:.8,dest:o,lp:240}); tone({f:[70,44],dur:.18,vol:.5,dest:o,lp:220,at:.27}); };
    beat(); const iv=setInterval(beat,830); return mk([],o,()=>clearInterval(iv)); },
  shh(){ const o=outG(1); let on=true, tid=0; const step=()=>{ if(!on) return; const t=AC.currentTime, s=AC.createBufferSource(); s.buffer=noiseBuf;
      const g=gn(0); chain(s,filt('highpass',2200),filt('lowpass',6500),g,o); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.32,t+.25); g.gain.setValueAtTime(.32,t+.75); g.gain.linearRampToValueAtTime(0,t+1.3);
      s.start(t); s.stop(t+1.35); tid=setTimeout(step,1800); }; step(); return mk([],o,()=>{ on=false; clearTimeout(tid); }); },
  bag(){ const o=outG(1); let on=true, tid=0; const step=()=>{ if(!on) return; const n=1+(R()*3|0); for(let i=0;i<n;i++) noiseBurst({dur:.015+R()*.06,vol:.12+R()*.25,ft:'highpass',freq:2500+R()*3500,dest:o,at:i*.02});
      tid=setTimeout(step,R()<.08?250+R()*300:25+R()*110); }; step(); return mk([],o,()=>{ on=false; clearTimeout(tid); }); },
  dryer(){ const o=outG(1), s=loopSrc(brownBuf), s2=loopSrc(noiseBuf), m=AC.createOscillator(); m.type='sawtooth'; m.frequency.value=118;
    chain(s,filt('lowpass',1800),gn(.5),o); chain(s2,filt('bandpass',3000,.7),gn(.07),o); chain(m,filt('lowpass',380),gn(.03),o); return mk([s,s2,m],o); },
  white(){ const o=outG(.2), s=loopSrc(noiseBuf); chain(s,filt('lowpass',9000),o); return mk([s],o); },
  rain(){ const o=outG(1), s=loopSrc(brownBuf), s2=loopSrc(noiseBuf); chain(s,filt('bandpass',900,.4),gn(.45),o); chain(s2,filt('highpass',5000),gn(.025),o);
    const iv=setInterval(()=>{ if(R()<.6) tone({f:[1800+R()*2200,900],dur:.04,vol:.02+R()*.03,dest:o}); },60); return mk([s,s2],o,()=>clearInterval(iv)); },
  wave(){ const o=outG(1), s=loopSrc(brownBuf), s2=loopSrc(noiseBuf), g=gn(.28), g2=gn(.025);
    chain(s,filt('lowpass',900),g,o); chain(s2,filt('bandpass',2500,.5),g2,o); const l=lfo(g.gain,.08,.26), l2=lfo(g2.gain,.08,.024); return mk([s,s2,l,l2],o); }
};
for(const [id,ic,lb,col,grp] of SOUNDS){ const b=document.createElement('button'); b.className='sb'; b.dataset.id=id; b.innerHTML=`<i style="--c:${col}">${ic}</i>${lb}`;
  b.addEventListener('click',()=>{ initAudio(); if(curId===id) stopSleep(); else playSleep(id); }); $('#sg'+grp).appendChild(b); }
function hardStop(){ // stop current and cut the whole sleep bus so nothing can keep ringing
  if(cur){ try{ cur(); }catch(e){} } cur=null; curId=null; fading=false;
  if(sleepGain){ const g=sleepGain; sleepGain=null; try{ g.gain.cancelScheduledValues(AC.currentTime); g.gain.setTargetAtTime(0,AC.currentTime,.1); }catch(e){} setTimeout(()=>{ try{ g.disconnect(); }catch(e){} },700); } }
function playSleep(id){ hardStop(); try{ cur=GEN[id](); curId=id; }catch(e){ console.error(e); hardStop(); }
  endAt=timerMin&&curId?Date.now()+timerMin*60000:0; refresh(); }
function stopSleep(){ hardStop(); endAt=0; refresh(); }
async function refresh(){
  document.querySelectorAll('.sb').forEach(b=>b.classList.toggle('on',b.dataset.id===curId));
  $('#sleep').classList.toggle('playing',!!curId); $('#stopAll').classList.toggle('live',!!curId);
  $('#nowp').textContent=curId?`♪ ${NAME[curId]} を ながしています`:'ききたい おとを タップしてね';
  try{ if(curId&&!wl&&navigator.wakeLock){ wl=await navigator.wakeLock.request('screen'); } if(!curId&&wl){ wl.release(); wl=null; } }catch(e){}
}
document.querySelectorAll('#tm button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#tm button').forEach(x=>x.classList.toggle('on',x===b)); timerMin=+b.dataset.m;
  endAt=(timerMin&&curId)?Date.now()+timerMin*60000:0; }));
$('#vol').addEventListener('input',()=>{ if(sleepGain&&!fading) sleepGain.gain.setTargetAtTime($('#vol').value/100,AC.currentTime,.05); });
$('#stopAll').addEventListener('click',stopSleep);
$('#sleepBack').addEventListener('click',()=>{ stopSleep(); show('home'); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&!curId&&AC) {} });
setInterval(()=>{ const r=$('#remain');
  if(!curId){ r.textContent=''; return; }
  if(!endAt){ r.textContent='タイマーなし（「とめる」で止まります）'; return; }
  const left=endAt-Date.now();
  if(left<=0){ stopSleep(); $('#nowp').textContent='おやすみなさい 🌙'; return; }
  if(left<10000&&!fading&&sleepGain){ fading=true; sleepGain.gain.setTargetAtTime(0,AC.currentTime,3); }
  r.textContent=`あと ${Math.ceil(left/60000)} 分で ゆっくり止まります`; },1000);
</script>
